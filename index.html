<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta
      name="description"
      content="京都花室 御むろの大輪胡蝶蘭。贈る場にふさわしい、圧巻のボリュームと華やかさをお届けします。"
    />
    <title>大輪胡蝶蘭｜京都花室 御むろ</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="lp">
      <section class="visual visual--hero" aria-label="京都花室 御むろ 大輪胡蝶蘭">
        <img
          src="img/FV.png"
          alt="他の胡蝶蘭と並ぶ場だからこそ、誰よりも目を引く一鉢を。京都花室 御むろ"
          width="1402"
          height="1122"
          fetchpriority="high"
        />
        <a class="hero-cta" href="#lineup">
          <span class="sr-only">最高級の大輪胡蝶蘭を見る</span>
        </a>
      </section>

      <section class="visual" aria-label="一般的な胡蝶蘭との比較">
        <img
          src="img/2.png"
          alt="一般的な3本立てと御むろの大輪胡蝶蘭10本立ての比較。大きさは贈り主の敬意を可視化する。"
          width="1024"
          height="1536"
          loading="lazy"
        />
      </section>

      <section class="visual" aria-label="胡蝶蘭選びのお悩み">
        <img
          src="img/3.png"
          alt="他の胡蝶蘭に埋もれないか、写真と違う商品が届かないか、ふさわしい大きさが分からない、といった胡蝶蘭選びのお悩み。"
          width="864"
          height="1821"
          loading="lazy"
        />
      </section>

      <section class="visual" id="lineup" aria-label="胡蝶蘭の商品ラインナップ">
        <img
          src="img/4.png"
          alt="5本立て、7本立て、10本立て、15本立て以上から、用途と祝意に合わせてお仕立てします。"
          width="974"
          height="1614"
          loading="lazy"
        />
      </section>
    </main>
  </body>
</html>
